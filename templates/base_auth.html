{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#047857">
    <title>{% block title %}MedShare{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/fonts.css' %}">
    <link rel="stylesheet" href="{% static 'css/medshare.css' %}">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <link rel="icon" type="image/png" href="{% static 'icons/icon-192.png' %}">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 text-body px-3 py-5 position-relative">
    <div class="auth-bg-base"></div>
    <div class="auth-bg-img"></div>
    <div class="auth-bg-mask"></div>

    <main class="w-100" style="max-width: 420px">
        <div class="text-center mb-4">
            <img src="{% static 'icons/logo-medshare.svg' %}" alt="Logo MedShare" style="height:64px;width:64px">
            <h1 class="fw-bold fs-3 text-white mt-3 mb-0">MedShare</h1>
            <p class="small mb-0" style="color: #a7f3d0">Dossiers médicaux partagés &amp; sécurisés</p>
        </div>

        {% if messages %}
            <div class="mb-3">
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'success' %}success{% elif message.tags == 'warning' %}warning{% else %}info{% endif %} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <div class="card auth-card rounded-4 p-4 p-md-5">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
