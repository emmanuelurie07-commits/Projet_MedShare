name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: Tests (moteur réel dlib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environnement micromamba + dlib conda-forge
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: test
          create-args: >-
            python=3.14
            dlib=20.0.1
            -c conda-forge

      - name: Dépendances
        shell: micromamba-shell {0}
        run: |
          python -m pip install --no-deps face-recognition
          python -m pip install \
            "face_recognition_models @ https://github.com/ageitgey/face_recognition_models/archive/refs/heads/master.tar.gz" \
            scipy Pillow click Django==6.1 python-dotenv setuptools==80.9.0

      - name: Suite de tests
        shell: micromamba-shell {0}
        run: python manage.py test
        env:
          SECRET_KEY: test
          ALLOWED_HOSTS: testserver
          DB_ENGINE: sqlite
          DEBUG: "True"

  build:
    name: Image Docker + smoke (mode reel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t medshare .

      - name: Smoke test — mode reel confirmé dans le conteneur
        run: >
          docker run --rm --entrypoint bash medshare -c
          "python -c 'import facial_recognition as fr; assert fr.MODE_RECHERCHE == \"reel\", fr.MODE_RECHERCHE; print(fr.MODE_LIBELLE)'"